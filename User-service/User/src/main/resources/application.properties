spring.application.name=user
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/userdb?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8082
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.cloud.config.enabled=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.data.rest.detection-strategy=annotated

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8081}
keycloak.realm=JobBoardKeycloack
keycloak.admin-username=admin
keycloak.admin-password=admin
keycloak.client-id=admin-cli