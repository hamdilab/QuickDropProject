# ===================================================================
# QuickDrop Tracking Service - Spring Boot Configuration
# ===================================================================
# Primary configuration file (YAML format)
# ===================================================================

spring:
  application:
    name: tracking-service
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:quickdrop_tracking}
      authentication-database: ${MONGODB_AUTH_DATABASE:admin}
      username: ${MONGODB_USERNAME:}
      password: ${MONGODB_PASSWORD:}

server:
  port: ${SERVER_PORT:8084}

# ===================================================================
# Eureka Service Discovery Configuration
# ===================================================================
eureka:
  client:
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:true}
    instance-id: ${spring.application.name}:${server.port}
    hostname: ${EUREKA_HOSTNAME:localhost}

# ===================================================================
# Feign Client Configuration
# ===================================================================
feign:
  client:
    enabled: ${FEIGN_ENABLED:true}
    config:
      default:
        connect-timeout: ${FEIGN_CONNECT_TIMEOUT:5000}
        read-timeout: ${FEIGN_READ_TIMEOUT:5000}
        loggerLevel: ${FEIGN_LOG_LEVEL:FULL}

# ===================================================================
# Actuator Configuration
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:always}

# ===================================================================
# Swagger/OpenAPI Documentation Configuration
# ===================================================================
springdoc:
  api-docs:
    path: ${SWAGGER_API_DOCS_PATH:/api-docs}
  swagger-ui:
    path: ${SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: ${SWAGGER_OPERATIONS_SORTER:method}

# ===================================================================
# Logging Configuration
# ===================================================================
logging:
  level:
    com.quickdrop.tracking: ${LOGGING_LEVEL_TRACKING:DEBUG}
    org.springframework.data.mongodb: ${LOGGING_LEVEL_MONGODB:INFO}
    com.quickdrop.tracking.webclient: ${LOGGING_LEVEL_WEBCLIENT:DEBUG}
    org.springframework.cloud.netflix.eureka: ${LOGGING_LEVEL_EUREKA:INFO}
    com.quickdrop.tracking.client: ${LOGGING_LEVEL_FEIGN_CLIENT:DEBUG}

# ===================================================================
# MongoDB Collections (Custom Properties)
# ===================================================================
base:
  package: com.quickdrop.tracking

mongodb:
  collections:
    driver-location: driver_locations
    trip-history: trip_history
    order-tracking: order_tracking

# ===================================================================
# Profiles
# ===================================================================
---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.quickdrop.tracking: DEBUG
    org.springframework: INFO

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

logging:
  level:
    com.quickdrop.tracking: INFO
    org.springframework: WARN

---
# Local/Testing Profile (No Eureka)
spring:
  config:
    activate:
      on-profile: local

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

feign:
  client:
    enabled: false

logging:
  level:
    com.quickdrop.tracking: DEBUG
