# ===================================================================
# QuickDrop Tracking Service - Spring Boot Configuration
# ===================================================================

# Server Configuration
server.port=8084

# Spring Application Name
spring.application.name=tracking-service

# MongoDB Configuration (Spring Boot 3.x - No longer deprecated)
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=quickdrop_tracking
# For authentication:
# spring.data.mongodb.authentication-database=admin
# spring.data.mongodb.username=your_username
# spring.data.mongodb.password=your_password

# Eureka Client Configuration (Service Discovery)
# Disable Eureka for local development
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

# Uncomment for production with Eureka Server:
# eureka.client.register-with-eureka=true
# eureka.client.fetch-registry=true
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# eureka.instance.prefer-ip-address=true
# eureka.instance.instance-id=${spring.application.name}:${server.port}

# Feign Client Configuration
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Logging
logging.level.com.quickdrop.tracking=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# ===================================================================
# MongoDB Collections (Custom Properties)
# ===================================================================
base.package=com.quickdrop.tracking
mongodb.collections.driver-location=driver_locations
mongodb.collections.trip-history=trip_history
mongodb.collections.order-tracking=order_tracking
