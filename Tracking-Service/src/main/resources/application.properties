# ===================================================================
# QuickDrop Tracking Service - Spring Boot Configuration
# ===================================================================

# ===================================================================
# Server Configuration
# ===================================================================
server.port=8084

# ===================================================================
# Spring Application Name
# ===================================================================
spring.application.name=tracking-service

# ===================================================================
# MongoDB Configuration
# ===================================================================
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:quickdrop_tracking}
spring.data.mongodb.authentication-database=${MONGODB_AUTH_DATABASE:admin}
spring.data.mongodb.username=${MONGODB_USERNAME:}
spring.data.mongodb.password=${MONGODB_PASSWORD:}

# ===================================================================
# Eureka Service Discovery Configuration
# ===================================================================
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_FETCH:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}

# ===================================================================
# Feign Client Configuration
# ===================================================================
feign.client.enabled=${FEIGN_ENABLED:true}
feign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT:5000}
feign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT:5000}
feign.client.config.default.loggerLevel=${FEIGN_LOG_LEVEL:FULL}

# ===================================================================
# Actuator Configuration
# ===================================================================
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:always}

# ===================================================================
# Swagger/OpenAPI Documentation Configuration
# ===================================================================
springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH:/api-docs}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.operations-sorter=${SWAGGER_OPERATIONS_SORTER:method}

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.quickdrop.tracking=${LOGGING_LEVEL_TRACKING:DEBUG}
logging.level.org.springframework.data.mongodb=${LOGGING_LEVEL_MONGODB:INFO}
logging.level.com.quickdrop.tracking.webclient=${LOGGING_LEVEL_WEBCLIENT:DEBUG}
logging.level.org.springframework.cloud.netflix.eureka=${LOGGING_LEVEL_EUREKA:INFO}
logging.level.com.quickdrop.tracking.client=${LOGGING_LEVEL_FEIGN_CLIENT:DEBUG}

# ===================================================================
# MongoDB Collections (Custom Properties)
# ===================================================================
base.package=com.quickdrop.tracking
mongodb.collections.driver-location=driver_locations
mongodb.collections.trip-history=trip_history
mongodb.collections.order-tracking=order_tracking

# ===================================================================
# Spring DevTools
# ===================================================================
spring.devtools.restart.enabled=true
spring.devtools.add-properties=true
