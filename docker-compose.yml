services:
  mysql:
    image: mysql:8.0
    container_name: quickdrop-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: quickdrop-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./Database/keycloak:/opt/keycloak/data/import:ro
    command: start-dev --import-realm

  eureka:
    build:
      context: ./eureka/EurekaDernier
    container_name: quickdrop-eureka
    ports:
      - "8761:8761"

  config-server:
    build:
      context: ./ConfigServer/ConfigServer
    container_name: quickdrop-config-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: -Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/
    ports:
      - "8888:8888"
    depends_on:
      - eureka

  user-service:
    build:
      context: ./User-service/User
    container_name: quickdrop-user-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/userdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: -Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: JobBoardKeycloack
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_CLIENT_ID: admin-cli
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka:
        condition: service_started
      gateway:
        condition: service_started

  catalog-service:
    build:
      context: ./Catalog-service/CatalogService
    container_name: quickdrop-catalog-service
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/Database/Data/Catalog;AUTO_SERVER=FALSE
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: -Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/
    ports:
      - "8088:8088"
    volumes:
      - catalog-data:/app/Database/Data
    depends_on:
      config-server:
        condition: service_started
      eureka:
        condition: service_started
      gateway:
        condition: service_started

  delivery-service:
    build:
      context: ./Delivery-service
    container_name: quickdrop-delivery-service
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/QuickDrop?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: -Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka:
        condition: service_started
      gateway:
        condition: service_started

  order-service:
    build:
      context: ./Order-service
    container_name: quickdrop-order-service
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: -Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/
    ports:
      - "8083:8082"
    depends_on:
      config-server:
        condition: service_started
      eureka:
        condition: service_started
      gateway:
        condition: service_started


  gateway:
    build:
      context: ./ApiGateway/getway
    container_name: quickdrop-gateway
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE: http://eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: -Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/JobBoardKeycloack
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/JobBoardKeycloack/protocol/openid-connect/certs
    ports:
      - "8084:8084"
    depends_on:
      eureka:
        condition: service_started
      config-server:
        condition: service_started

  frontend:
    build:
      context: ./frontend/frontend
    container_name: quickdrop-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/frontend:/app
      - /app/node_modules
    depends_on:
      gateway:
        condition: service_started

volumes:
  mysql-data:
  catalog-data:
