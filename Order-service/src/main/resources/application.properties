spring.application.name=order-service


# Dit à Spring d'aller chercher les propriétés sur le Config Server (port 8888 par défaut)
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}


# Optionnel mais recommandé : fait crasher le microservice si le serveur de config est éteint
spring.cloud.config.fail-fast=true
